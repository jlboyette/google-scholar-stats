name: Update Google Scholar Metrics

on:
  # Run every Sunday at 8:17 AM Eastern Standard Time
  schedule:
    - cron: "17 13 * * 0"

  # Allow manual updates from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scholar-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scholarly

      - name: Update Google Scholar metrics
        run: python update_scholar.py

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scholar_stats.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Google Scholar metrics"
            git push
          fi
